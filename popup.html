<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Halloween Costume for Google</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>🎃 Halloween Costume</h1>
  <p id="status">Loading…</p>

  <label class="row">
    <input type="checkbox" id="enabled">
    <span>Costume on</span>
  </label>

  <label class="row">
    <input type="checkbox" id="disableSite">
    <span>Turn off on this site: <span id="siteName">–</span></span>
  </label>

  <label class="row">
    <input type="checkbox" id="autoOff">
    <span>Auto-off after the season ends</span>
  </label>

  <label class="row">
    <span>Season ends</span>
    <input type="date" id="seasonEnd">
  </label>

  <button type="button" id="openNewTab">Open Halloween new tab</button>

  <p class="note">
    Browser-only. This extension themes Google pages and its own new tab
    page. It does not change your computer's wallpaper or system theme.
    It collects and sends nothing; settings stay on this computer.
  </p>

  <script src="popup.js"></script>
</body>
</html>
